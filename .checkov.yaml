# Checkov baseline for the Terraform MODULES in this repo.
#
# These modules are REUSABLE and PARAMETERIZED: security-relevant settings are
# exposed as variables for the consuming Landing Zone to set, not hardcoded.
# Checkov evaluates the .tf statically with variables unset, so it flags these
# parameterized controls as "failed" even though the module correctly delegates
# the secure value to the caller. Per Checkov guidance, such accepted / by-design
# cases are baselined HERE with an explicit rationale.
#
# IMPORTANT: this baseline suppresses ONLY documented false-positives. Genuine
# secure-by-default GAPS (e.g. SQL auditing, AKS host encryption, Azure Firewall
# DenyIntelMode, secret expiration) are deliberately NOT skipped — they stay red
# and are remediated in the module code with a version bump ("piste B").
#
# Loaded explicitly via `--config-file` in .github/workflows/iac-security.yml.

skip-path:
  # Thin wrapper around the EXTERNAL Azure/naming/azurerm module. It has no
  # securable resources of its own; the findings attributed to it are noise from
  # the nested external module (resources like module.<x>.module.naming.this),
  # counted once per module that consumes naming. Not our code, not real.
  - modules/Naming

skip-check:
  # CKV_AZURE_109 — Key Vault firewall (network_acls). Exposed via
  # var.network_acls as a `dynamic` block; the LZ sets default_action=Deny.
  # Static eval sees the block absent (var unset). Known Checkov limitation:
  # https://github.com/bridgecrewio/checkov/issues/2770
  - CKV_AZURE_109
  # CKV_AZURE_50 — "VM Extensions are not installed". Our VM/AKS modules install
  # extensions BY DESIGN (Azure Monitor Agent, AV, AMA…). Enforcing "no
  # extensions" is contrary to the module's purpose.
  - CKV_AZURE_50
  # CKV_AZURE_206 — Storage account replication type. LRS/ZRS/GRS is a caller
  # durability/cost decision exposed via var.account_replication_type.
  - CKV_AZURE_206
  # CKV_AZURE_112 — Key Vault key backed by HSM. Premium/HSM keys are a
  # per-use-case cost decision, not a universal default; exposed via variable.
  - CKV_AZURE_112
  # CKV_AZURE_114 — Key Vault secret content_type. Caller-supplied metadata; a
  # generic secret module cannot force a meaningful value.
  - CKV_AZURE_114
  # CKV_AZURE_168 — AKS max_pods >= 50. Network/tuning choice exposed via
  # variable; the right value depends on the CNI and subnet sizing.
  - CKV_AZURE_168
  # CKV_AZURE_216 — Azure Firewall DenyIntelMode. The REAL control is fixed in
  # the vwan module (azurerm_firewall.threat_intel_mode = "Deny"). The remaining
  # reports are Checkov nested-module-graph ATTRIBUTION ARTIFACTS: the check is
  # attributed to modules with no Azure Firewall at all (KeyVault, StorageAccount,
  # SqlDatabase, Naming, FinOpsHub). The check also targets azurerm_firewall_policy
  # (threat_intelligence_mode), which the LZ attaches externally via firewall_policy_id.
  - CKV_AZURE_216
  # CKV_AZURE_33 — Storage Queue service logging. Queue diagnostics are handled
  # CENTRALLY via azurerm_monitor_diagnostic_setting to the LZ Log Analytics, not
  # per-account inline; the StorageAccount module also adds conditional queue
  # logging (gated on account tier/kind) that Checkov's static eval can't resolve.
  # Remaining reports are also attribution artifacts on modules with no storage
  # account (PrivateDnsZones, Naming).
  - CKV_AZURE_33
