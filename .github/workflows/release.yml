# Release Assets — builds the terraform-docs bundle + notes for a tag.
#
# Two entry points:
#   - `workflow_call` from Release Please (the normal path): the release
#     and its CHANGELOG-based notes already exist — this only attaches the
#     terraform-docs bundle to it.
#   - direct `v*` tag push (fallback for hand-cut tags): no release exists
#     yet — this creates one with auto-generated notes (git log since the
#     previous tag) and the bundle attached.
#
# Both paths are idempotent: an existing release gets `upload --clobber`,
# so a double trigger (e.g. a PAT-created tag firing the push trigger on
# top of the workflow_call) never fails.

name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Existing v* tag to build assets for'
        required: true
        type: string

permissions:
  contents: write   # upload assets / create the GitHub Release

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build docs bundle + attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0   # full history — needed for "git log since previous tag"

      - name: Install terraform-docs
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/terraform-docs.tar.gz \
            https://terraform-docs.io/dl/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Generate terraform-docs per submodule
        run: |
          set -euo pipefail
          OUT="terraform-docs-$TAG"
          mkdir -p "$OUT"
          for dir in modules/*/; do
            mod=$(basename "$dir")
            terraform-docs markdown table --output-file "/dev/stdout" "$dir" > "$OUT/$mod.md" 2>/dev/null || {
              echo "[skip] $mod (terraform-docs failed — likely missing inputs/outputs)"
              rm -f "$OUT/$mod.md"
            }
            [ -s "$OUT/$mod.md" ] && echo "[ok]   $mod -> $OUT/$mod.md ($(wc -l < "$OUT/$mod.md") lines)" || true
          done
          # Also generate for the root meta-module.
          terraform-docs markdown table --output-file "/dev/stdout" . > "$OUT/_root.md" 2>/dev/null || true

          tar -czf "$RUNNER_TEMP/$OUT.tar.gz" "$OUT"
          ls -la "$RUNNER_TEMP/$OUT.tar.gz"

      - name: Generate release notes (fallback path only)
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          NOTES="$RUNNER_TEMP/release-notes-$TAG.md"
          {
            echo "# Release $TAG"
            echo ""
            echo "## Changes since ${PREV:-the beginning}"
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
          } > "$NOTES"
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach assets (create the release if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release Please path: the release + CHANGELOG notes exist — only
            # attach the bundle (idempotent thanks to --clobber).
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$RUNNER_TEMP/terraform-docs-$TAG.tar.gz"
            echo "Assets attached to existing release $TAG."
          else
            # Hand-pushed tag: create the release with git-log notes.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes-$TAG.md" \
              "$RUNNER_TEMP/terraform-docs-$TAG.tar.gz"
          fi
