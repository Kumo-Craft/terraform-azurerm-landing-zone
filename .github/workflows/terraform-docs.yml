# Terraform Docs — keeps every submodule README's inputs/outputs
# reference in sync with the .tf sources (config: /.terraform-docs.yml).
#
# Runs after module code lands on main, regenerates the docs and — only
# when something actually changed — opens/updates a single `docs/terraform-docs`
# PR with the refreshed tables. Modules with no README get one generated;
# hand-written READMEs get a "## Reference" section appended (the injection
# only ever touches the BEGIN_TF_DOCS/END_TF_DOCS block, prose is preserved).
#
# WHY A PR AND NOT A DIRECT PUSH: main is branch-protected (required
# "CI OK" check), so a bot push to main would be rejected. A PR keeps the
# docs change reviewable.
#
# CAVEAT: the PR is opened with the default token, so CI does not run on
# it (same anti-recursion rule as release-please). Merge it with the admin
# override — it only touches README.md files — or close/reopen it once to
# trigger CI as yourself.

name: Terraform Docs

on:
  push:
    branches: [main]
    paths:
      - 'modules/**/*.tf'
      - '.terraform-docs.yml'
  workflow_dispatch:

# Least privilege: read-only at workflow level, writes granted per job.
permissions:
  contents: read

concurrency:
  group: terraform-docs
  cancel-in-progress: true

jobs:
  docs:
    name: Refresh module READMEs
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the docs/terraform-docs branch
      pull-requests: write   # open the docs PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install terraform-docs
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/terraform-docs.tar.gz \
            https://terraform-docs.io/dl/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Generate docs (inject per submodule)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            mod=$(basename "$dir")
            readme="${dir}README.md"
            # Seed the injection markers: a full README for modules without
            # one, an appended "## Reference" section for hand-written ones.
            if [ ! -f "$readme" ]; then
              printf '# %s\n\n<!-- BEGIN_TF_DOCS -->\n<!-- END_TF_DOCS -->\n' "$mod" > "$readme"
            elif ! grep -q 'BEGIN_TF_DOCS' "$readme"; then
              printf '\n## Reference\n\n<!-- BEGIN_TF_DOCS -->\n<!-- END_TF_DOCS -->\n' >> "$readme"
            fi
            terraform-docs -c .terraform-docs.yml "$dir"
          done
          echo "── Changed files:"
          git diff --name-only | sed 's/^/  /' || true

      - name: Open docs PR (only if something changed)
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: docs/terraform-docs
          delete-branch: true
          commit-message: 'docs: refresh terraform-docs reference tables'
          title: 'docs: refresh terraform-docs reference tables'
          body: |
            Auto-generated by the **Terraform Docs** workflow: submodule
            README inputs/outputs tables regenerated from the current `.tf`
            sources (only the `BEGIN_TF_DOCS` blocks are touched).

            CI does not run on bot-opened PRs — merge with the admin
            override (docs-only change) or close/reopen once to trigger it.
          labels: documentation
